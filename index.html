<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>R&amp;D Center Europe – Navigation</title>
<style>
  :root {
    --blue-deep: #003781;   /* Allianz blue */
    --border: rgba(0, 55, 129, .28);
    --border-hover: rgba(0, 55, 129, .65);
    --shadow: 0 1px 3px rgba(0, 55, 129, .06), 0 2px 8px rgba(0, 55, 129, .05);
    --shadow-hover: 0 4px 14px rgba(0, 55, 129, .14), 0 2px 4px rgba(0, 55, 129, .06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #ffffff;
    color-scheme: light;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Allianz Neo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
  }

  .nav {
    width: 100%;
    max-width: 1040px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }

  a.item {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 56px;
    padding: 10px 26px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    color: var(--blue-deep);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .005em;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    outline: none;
    transition: transform .25s cubic-bezier(.2,.7,.2,1),
                box-shadow .25s ease,
                border-color .25s ease;
  }
  /* open-link arrow: hidden by default, slides in from the top-right on hover */
  .arrow {
    position: absolute;
    top: 11px;
    right: 13px;
    width: 14px;
    height: 14px;
    fill: none;
    stroke: var(--blue-deep);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: translate(6px, -6px);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  @media (hover: hover) {
    a.item:hover .arrow { opacity: 1; transform: translate(0, 0); }
    a.item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
    }
  }
  a.item:focus-visible {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border-hover);
    outline: 2px solid var(--blue-deep);
    outline-offset: 3px;
  }
  a.item:focus-visible .arrow { opacity: 1; transform: translate(0, 0); }
  a.item:active { transform: translateY(-1px); }

  /* tablet / small: two per row */
  @media (max-width: 900px) {
    .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 560px; }
  }
  /* phone: single column */
  @media (max-width: 460px) {
    .nav { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    a.item { min-height: 50px; }
  }
  /* very short containers: tighten so everything still fits */
  @media (max-height: 300px) and (max-width: 460px) {
    body { padding: 8px 14px; }
    .nav { gap: 8px; }
    a.item { min-height: 42px; padding: 6px 26px; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
