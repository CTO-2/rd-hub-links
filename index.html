<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>R&amp;D Center Europe – Navigation</title>
<style>
  /* Lets the gradient angle be animated smoothly */
  @property --a {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
  }

  :root {
    --blue-deep: #003781;   /* Allianz dark blue */
    --blue-light: #00a0dc;  /* Allianz light blue */
    --shadow: 0 1px 3px rgba(0, 55, 129, .06), 0 2px 8px rgba(0, 55, 129, .05);
    --shadow-hover: 0 4px 14px rgba(0, 55, 129, .14), 0 2px 4px rgba(0, 55, 129, .06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #ffffff;
    color-scheme: light;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Allianz Neo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
  }

  .nav {
    width: 100%;
    max-width: 1040px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }

  a.item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    padding: 10px 28px;

    /* One continuous gradient border: white fill inside, rotating conic gradient in the border area.
       Mostly #003781, with a soft #00A0DC accent that wraps seamlessly (first stop = last stop). */
    border: 1.5px solid transparent;
    border-radius: 14px;
    background:
      linear-gradient(#ffffff, #ffffff) padding-box,
      conic-gradient(from var(--a),
        var(--blue-deep) 0%,
        var(--blue-deep) 62.5%,
        var(--blue-light) 81.25%,
        var(--blue-deep) 100%) border-box;
    animation: flow 18s linear infinite;

    box-shadow: var(--shadow);
    color: var(--blue-deep);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: .005em;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    outline: none;
    transition: transform .25s cubic-bezier(.2,.7,.2,1),
                box-shadow .25s ease;
  }
  @keyframes flow { to { --a: 360deg; } }
  a.item:nth-child(2) { animation-delay: -4.5s; }
  a.item:nth-child(3) { animation-delay: -9s; }
  a.item:nth-child(4) { animation-delay: -13.5s; }

  /* open-link arrow: hidden by default, slides in from the top-right on hover */
  .arrow {
    position: absolute;
    top: 12px;
    right: 15px;
    width: 14px;
    height: 14px;
    fill: none;
    stroke: var(--blue-deep);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform: translate(6px, -6px);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  @media (hover: hover) {
    a.item:hover .arrow { opacity: 1; transform: translate(0, 0); }
    a.item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
  }
  a.item:focus-visible {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    outline: 2px solid var(--blue-deep);
    outline-offset: 3px;
  }
  a.item:focus-visible .arrow { opacity: 1; transform: translate(0, 0); }
  a.item:active { transform: translateY(-1px); }

  /* tablet / small: two per row */
  @media (max-width: 900px) {
    .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 560px; }
  }
  /* phone: single column */
  @media (max-width: 460px) {
    .nav { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    a.item { min-height: 50px; }
  }
  /* very short containers: tighten so everything still fits */
  @media (max-height: 300px) and (max-width: 460px) {
    body { padding: 8px 14px; }
    .nav { gap: 8px; }
    a.item { min-height: 42px; padding: 6px 28px; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    a.item { animation: none; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
